<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sınaq imtahanının nəticələri</title>
<style>
:root{--text:#3a3d46;--strong:#1b1e2b;--line:#dfe2ea;--gold:#e4a900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
background-image:radial-gradient(circle at 100% 8%,transparent 0 38px,rgba(236,72,120,.10) 39px 44px,transparent 45px 60px,rgba(59,130,246,.10) 61px 66px,transparent 67px),
radial-gradient(circle at 0% 92%,transparent 0 38px,rgba(59,130,246,.10) 39px 44px,transparent 45px 60px,rgba(236,72,120,.10) 61px 66px,transparent 67px);background-repeat:no-repeat}
main{max-width:520px;margin:0 auto;padding:16px 22px 48px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:8px}
.top .ttl{font-size:13px;color:#9096a6}
.circ{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:#fff;color:var(--gold);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.back{background:none;border:0;color:var(--gold);font-size:19px;cursor:pointer;padding:8px 0}
h1{font-size:34px;margin:18px 0 20px;color:var(--strong)}
.big{font-size:44px;font-weight:700;color:var(--strong);margin:-8px 0 36px}
.line{font-size:26px;margin:0 0 14px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:14px 26px;font-size:20px;font-weight:600;color:var(--strong);background:#fff;margin:0 0 -26px;position:relative;z-index:1;max-width:100%}
.inner{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.92);padding:52px 24px 14px;margin:0 0 34px 28px;box-shadow:0 1px 3px rgba(20,24,40,.05)}
.inner p{margin:0;padding:11px 0;font-size:18px}
.inner b{color:var(--strong);font-weight:700}
.inner .num{font-size:46px;font-weight:700;color:var(--strong);text-align:center;padding:4px 0 10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="home">
<div class="top"><span class="ttl">Sınaq imtahanının nəticələri</span><button class="circ" id="more" aria-label="Подробнее">⋯</button></div>
<div class="pill">Общий балл</div>
<div class="inner"><p class="num" id="total">0</p></div>
<div id="list"></div>
</section>
<section id="details" class="hide">
<div class="top"><button class="back" id="back">‹ Назад</button><span class="ttl">Sınaq imtahanının nəticələri</span></div>
<div id="full"></div>
</section>
</main>
<script>
var data=[
 {name:"Математика",short:"Матем",score:"74.8",rows:[["Количество закрытых ответов",12],["Количество открытых ответов",3],["Количество неполных ответов",2]]},
 {name:"Русский язык",short:"Русс",score:"77.5",rows:[["Количество закрытых ответов",17],["Количество открытых ответов",5],["Количество неполных ответов",4]]},
 {name:"Английский язык",short:"Англ",score:"73.3",rows:[["Количество правильных ответов",19],["Количество неправильных ответов",5],["Количество неполных ответов",1]]}
];
var sum=0,list=document.getElementById("list"),full=document.getElementById("full");
data.forEach(function(s){
 sum+=parseFloat(s.score);
 list.insertAdjacentHTML("beforeend",'<div class="pill">'+s.name+'</div><div class="inner"><p>Результат: <b>'+s.score+'</b></p></div>');
 var rows=s.rows.map(function(r){return "<p>"+r[0]+": <b>"+r[1]+"</b></p>"}).join("");
 full.insertAdjacentHTML("beforeend",'<div class="pill">'+s.name+' (Максимум: 100)</div><div class="inner">'+rows+'<p>Результат: <b>'+s.score+'</b></p></div>');
});
document.getElementById("total").textContent=sum.toFixed(1);
function route(){var d=location.hash==="#details";
 document.getElementById("home").classList.toggle("hide",d);
 document.getElementById("details").classList.toggle("hide",!d);window.scrollTo(0,0);}
document.getElementById("more").onclick=function(){location.hash="details"};
document.getElementById("back").onclick=function(){location.hash="home"};
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
